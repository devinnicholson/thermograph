name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust 1.85 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.85"
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run locked tests
        run: cargo test --locked
      - name: Require public API documentation
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo rustdoc --locked --all-features --lib

  stable:
    name: Rust stable / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Run executable quickstart
        run: cargo run --locked --example switch
      - name: Run bounded semantic quickstart
        run: cargo run --locked --example semantic
      - name: Run locked tests
        run: cargo test --locked
      - name: Verify publishable package
        run: cargo package --locked
      - name: Test the packaged source archive
        run: cargo test --locked --manifest-path target/package/thermograph-0.1.0/Cargo.toml
