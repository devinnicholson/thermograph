[package]
name = "thermograph"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bounded exact short-game canonicalization and approximate thermography"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devinnicholson/thermograph"
homepage = "https://github.com/devinnicholson/thermograph"
documentation = "https://docs.rs/thermograph"
readme = "README.md"
keywords = ["combinatorial-games", "game-theory", "thermograph", "surreal"]
categories = ["algorithms", "mathematics", "science"]
include = [
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/CONTRIBUTING.md",
    "/Cargo.lock",
    "/DCO.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/conformance/**",
    "/docs/**",
    "/examples/**",
    "/src/**",
    "/tests/**",
]

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[package.metadata.docs.rs]
all-features = true
